spring.application.name=timebank-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:timebank;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

timebank.jwt.secret=${TIMEBANK_JWT_SECRET:timebank-local-development-secret-key-change-me-2026}
timebank.jwt.expiration-hours=24
timebank.cors.allowed-origins=*
